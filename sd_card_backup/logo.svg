<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D214F;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#153E7E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A56A6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4285F4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8AB4F8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="200" rx="24" fill="url(#bgGrad)"/>

  <!-- Architectural Background Vector Geometry -->
  <g opacity="0.18">
    <path d="M-20,120 Q200,40 420,140 T820,80 L820,200 L-20,200 Z" fill="#FFFFFF" />
    <circle cx="720" cy="100" r="140" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="8 8" />
    <circle cx="720" cy="100" r="80" fill="none" stroke="#FFFFFF" stroke-width="1.5" />
    <path d="M620,100 L820,100 M720,0 L720,200" stroke="#FFFFFF" stroke-width="1.5" />
  </g>

  <!-- Left Icon Mark -->
  <g transform="translate(36, 26)">
    <!-- Outer Card Frame -->
    <rect width="148" height="148" rx="32" fill="#131316" fill-opacity="0.6" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <rect x="24" y="20" width="100" height="108" rx="14" fill="none" stroke="#FFFFFF" stroke-width="3.5" opacity="0.9"/>
    
    <!-- MicroSD/Flash Pin Connectors -->
    <rect x="36" y="32" width="14" height="24" rx="3" fill="#FBBC05"/>
    <rect x="58" y="32" width="14" height="24" rx="3" fill="#34A853"/>
    <rect x="80" y="32" width="14" height="24" rx="3" fill="#4285F4"/>
    <rect x="102" y="32" width="14" height="24" rx="3" fill="#EA4335"/>

    <!-- Center Backup Recovery Symbol -->
    <circle cx="74" cy="94" r="18" fill="url(#accentGrad)"/>
    <path d="M74 84 L74 104 M64 94 L84 94" stroke="#002A5A" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Typography & Badges -->
  <g transform="translate(216, 48)">
    <!-- Suite Title -->
    <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Google Sans', Roboto, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">
      SD Backup &amp; Storage Health
    </text>

    <!-- Subtitle -->
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="15" font-weight="400" fill="#D2E3FC" opacity="0.9">
      Live Raw Block Replication &bull; JEDEC Wear Analytics &bull; Disaster Recovery
    </text>

    <!-- Badges Row -->
    <g transform="translate(0, 86)">
      <!-- Badge 1: Protection Mode -->
      <rect x="0" y="0" width="138" height="26" rx="13" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="14" y="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="11" font-weight="500" fill="#8AB4F8">RAW BLOCK READY</text>

      <!-- Badge 2: Parallel Compression -->
      <rect x="148" y="0" width="124" height="26" rx="13" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="162" y="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="11" font-weight="500" fill="#81C995">PIGZ COMPRESS</text>

      <!-- Badge 3: 3-2-1 Cloud Sync -->
      <rect x="282" y="0" width="122" height="26" rx="13" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="296" y="17" font-family="-apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="11" font-weight="500" fill="#FDD663">3-2-1 RCLONE</text>
    </g>
  </g>
</svg>
