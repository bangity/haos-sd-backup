configuration:
  source_dev:
    name: "Source Storage Device"
    description: "The physical disk to clone. Select 'auto' to dynamically detect the active boot drive (/dev/mmcblk0 for SD cards, /dev/sda for USB SSDs, or /dev/nvme0n1 for NVMe)."
  target_dir:
    name: "Target Backup Directory (SMB or Local)"
    description: "Destination folder where compressed archives and recovery scripts will be stored. Point this to your mounted network share (e.g., /backup or /backup/haos)."
  retention_count:
    name: "Backup Retention Limit"
    description: "Number of complete backup cycles to keep. When a new backup succeeds, older images, checksums, logs, and restore scripts beyond this limit are safely deleted."
  enable_rescue:
    name: "Bad Sector Rescue Mode"
    description: "Enables 'conv=noerror,sync' during disk streaming. If bad flash sectors are encountered, they are padded with zeroes so the backup can finish instead of aborting."
  run_backup_on_start:
    name: "Execute Immediate Snapshot on Boot"
    description: "If enabled, triggers a full disk backup immediately whenever this add-on starts or restarts."
  safe_wear_threshold:
    name: "Flash Wear Warning Threshold (%)"
    description: "The percentage of flash lifetime exhaustion that triggers persistent Home Assistant alerts and email notifications (Recommended: 80%)."
  backup_cron:
    name: "Backup Schedule (Cron Expression)"
    description: "Standard 5-part cron syntax defining how often disk backups run. Default: '0 3 * * 0' (Every Sunday at 3:00 AM)."
  wear_cron:
    name: "Wear Diagnostic Schedule (Cron Expression)"
    description: "Standard cron syntax for JEDEC flash health diagnostics. Default: '0 12 * * 1' (Every Monday at 12:00 PM)."
  rclone_sync_enabled:
    name: "Enable Rclone 3-2-1 Cloud Replication"
    description: "Automatically upload completed disk archives to offsite cloud storage (Backblaze B2, Google Drive, OneDrive, S3) after local creation."
  rclone_remote_target:
    name: "Rclone Remote Target Path"
    description: "The destination remote and bucket/folder configured in rclone (e.g., 'gdrive:HomeAssistant_Backups' or 'b2:my-haos-bucket/backups')."
  smtp_enabled:
    name: "Enable SMTP Email Alerts"
    description: "Dispatches status emails upon successful backup completion or when critical storage wear is detected."
  smtp_host:
    name: "SMTP Server Hostname"
    description: "Outgoing mail server address (e.g., 'smtp.gmail.com')."
  smtp_port:
    name: "SMTP Server Port"
    description: "Port number: 587 for STARTTLS or 465 for SSL."
  smtp_user:
    name: "SMTP Username / Sender Email"
    description: "Your full email address used to authenticate with the mail server."
  smtp_pass:
    name: "SMTP App Password"
    description: "A 16-character application password generated by your email provider."
  smtp_to:
    name: "Alert Recipient Email"
    description: "Destination email address that will receive backup summaries and wear alerts."