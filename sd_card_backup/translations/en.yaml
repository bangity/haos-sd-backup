configuration:
  source_dev:
    name: "Source Storage Device"
    description: "The physical disk to clone. Select 'auto' to dynamically detect the boot drive (/dev/mmcblk0, /dev/sda, or /dev/nvme0n1)."
  target_dir:
    name: "Target Backup Directory (SMB or Local)"
    description: "Destination directory where compressed archives and recovery scripts will be stored."
  retention_count:
    name: "Backup Retention Limit"
    description: "Number of complete backup cycles to keep before pruning older archives."
  enable_rescue:
    name: "Bad Sector Rescue Mode"
    description: "Enables 'conv=noerror,sync' during disk streaming to pad unreadable sectors with zeroes."
  run_backup_on_start:
    name: "Execute Immediate Snapshot on Boot"
    description: "Triggers a full disk backup immediately whenever the add-on starts."
  safe_wear_threshold:
    name: "Flash Wear Warning Threshold (%)"
    description: "Percentage of flash lifetime exhaustion that triggers warnings (Default: 80%)."
  backup_cron:
    name: "Backup Schedule (Cron Expression)"
    description: "Cron syntax defining backup frequency. Default: '0 3 * * 0' (Every Sunday at 3:00 AM)."
  wear_cron:
    name: "Wear Diagnostic Schedule (Cron Expression)"
    description: "Cron syntax for flash wear checks. Default: '0 12 * * 1' (Every Monday at 12:00 PM)."
  rclone_sync_enabled:
    name: "Enable Rclone 3-2-1 Cloud Replication (Optional)"
    description: "Automatically upload completed disk archives to offsite cloud storage via rclone."
  rclone_remote_target:
    name: "Rclone Remote Target Path (Optional)"
    description: "Destination remote bucket/folder (e.g., 'b2:my-haos-bucket/backups')."
  smtp_enabled:
    name: "Enable SMTP Email Alerts (Optional)"
    description: "Enable or disable email alerts upon backup completion or hardware wear warnings."
  smtp_host:
    name: "SMTP Server Hostname (Optional)"
    description: "Outgoing mail server address (e.g., 'smtp.gmail.com'). Leave blank if disabled."
  smtp_port:
    name: "SMTP Server Port (Optional)"
    description: "Port number: 587 for STARTTLS or 465 for SSL."
  smtp_user:
    name: "SMTP Username / Sender Email (Optional)"
    description: "Sender email address. Leave blank if disabled."
  smtp_pass:
    name: "SMTP App Password (Optional)"
    description: "Application password for your email account. Leave blank if disabled."
  smtp_to:
    name: "Alert Recipient Email (Optional)"
    description: "Recipient email address. Leave blank if disabled."