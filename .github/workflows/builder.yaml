name: Build Add-on

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Multi-Arch Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build via Home Assistant Builder
        uses: home-assistant/builder@2024.08.0
        with:
          args: |
            --all \
            --target sd_card_backup \
            --image "ghcr.io/bangity/haos-sd-backup-{arch}" \
            --docker-hub "ghcr.io/bangity"